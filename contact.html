    <!-- Scripts for interactivity and dark mode -->
    <script>
        // Dark mode toggle logic
        const darkModeToggle = document.getElementById('darkModeToggle');
        const darkModeIcon = document.getElementById('darkModeIcon');
        function setDarkMode(on) {
          document.documentElement.classList.toggle('dark', on);
          localStorage.setItem('darkMode', on ? '1' : '0');
          darkModeIcon.textContent = on ? '☀️' : '🌙';
        }
        setDarkMode(localStorage.getItem('darkMode') === '1');
        darkModeToggle.onclick = () => setDarkMode(!document.documentElement.classList.contains('dark'));

        // Navbar shadow on scroll
        const navbar = document.getElementById('navbar');
        window.addEventListener('scroll', () => {
          if (window.scrollY > 10) {
            navbar.classList.add('shadow-lg');
          } else {
            navbar.classList.remove('shadow-lg');
          }
        });

        // Scroll to top button logic
        const scrollTopBtn = document.getElementById('scrollTopBtn');
        window.onscroll = function() {
            if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) {
                scrollTopBtn.style.display = 'block';
            } else {
                scrollTopBtn.style.display = 'none';
            }
        };
        scrollTopBtn.onclick = function() {
            window.scrollTo({top: 0, behavior: 'smooth'});
        };

        // Reveal animations for sections
        function revealOnScroll() {
          document.querySelectorAll('.fade-in').forEach(el => {
            const rect = el.getBoundingClientRect();
            if (rect.top < window.innerHeight - 60) {
              el.classList.add('visible');
            }
          });
        }
        window.addEventListener('scroll', revealOnScroll);
        window.addEventListener('DOMContentLoaded', revealOnScroll);

        // Contact form feedback (mock)
        const contactForm = document.getElementById('contactForm');
        if (contactForm) {
          contactForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const feedback = document.getElementById('formFeedback');
            feedback.textContent = 'Thank you for your message! (This is a demo.)';
            feedback.className = 'block mt-2 text-green-600 dark:text-green-400 text-center';
            contactForm.reset();
          });
        }
        // Profile photo multi-extension support
        function setProfilePhoto(imgId) {
          const exts = ["jpg", "jpeg", "png"];
          const base = "assets/profile.";
          const placeholder = "https://ui-avatars.com/api/?name=John+Oyoo+Omolo&background=0D8ABC&color=fff&size=128";
          const img = document.getElementById(imgId);
          let found = false;
          let i = 0;
          function tryNext() {
            if (i >= exts.length) {
              img.src = placeholder;
              return;
            }
            const testSrc = base + exts[i];
            const testImg = new window.Image();
            testImg.onload = function() {
              img.src = testSrc;
              found = true;
            };
            testImg.onerror = function() {
              i++;
              tryNext();
            };
            testImg.src = testSrc;
          }
          tryNext();
        }
        setProfilePhoto("profilePhotoNavbar");
    </script>
